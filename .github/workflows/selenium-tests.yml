name: Selenium OrangeHRM Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Firefox
        shell: pwsh
        run: choco install firefox -y --no-progress

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest pytest-html pytest-xdist

      - name: Download Selenium Server
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.50.0/selenium-server-4.50.0.jar" -OutFile "selenium-server-4.50.0.jar"

      - name: Start Selenium Grid
        shell: pwsh
        run: |
          $grid = Start-Process -FilePath "java" -ArgumentList "-jar", "selenium-server-4.50.0.jar", "standalone" -PassThru -RedirectStandardOutput "grid.log" -RedirectStandardError "grid-error.log"
          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-RestMethod "http://localhost:4444/status"
              if ($response.value.ready -eq $true) {
                $ready = $true
                break
              }
            } catch {}
            if ($grid.HasExited) {
              Write-Host "Selenium Grid stopped unexpectedly."
              break
            }
          }
          if (-not $ready) {
            Get-Content grid.log, grid-error.log -ErrorAction SilentlyContinue
            throw "Selenium Grid did not become ready."
          }
          Write-Host "Selenium Grid is ready."

      - name: Run Grid tests
        env:
          FIREFOX_BINARY: 'C:\Program Files\Mozilla Firefox\firefox.exe'
        shell: pwsh
        run: |
          pytest -v -n 2 --dist=loadfile test_login_grid.py test_dashboard_grid.py --html=report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: report.html
          if-no-files-found: warn
